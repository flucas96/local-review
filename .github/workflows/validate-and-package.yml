name: Validate and package

on:
  workflow_dispatch:
    inputs:
      approve_checks:
        description: I approve type checking, automated tests, and packaging for this run
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicit approval
        env:
          APPROVE_CHECKS: ${{ inputs.approve_checks }}
        run: |
          if [ "$APPROVE_CHECKS" != "true" ]; then
            echo "::error::Approve the checks when dispatching this workflow."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run regression tests
        run: npm test
      - name: Package VSIX
        run: npm run package
      - name: Upload installable extension
        uses: actions/upload-artifact@v7
        with:
          name: local-review-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14
