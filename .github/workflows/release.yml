name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed in package.json, without a v prefix
        required: true
        type: string
      approve_release:
        description: I approve checks, packaging, and creation of a draft GitHub prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: local-review-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Require approval and the main branch
        env:
          APPROVE_RELEASE: ${{ inputs.approve_release }}
        run: |
          if [ "$APPROVE_RELEASE" != "true" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run from main and explicitly approve checks and draft-release creation."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Match the committed version
        id: metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const version = process.env.RELEASE_VERSION;
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version ?? '') || version !== manifest.version) {
            throw new Error('The requested version must match the committed package.json version.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run regression tests
        run: npm test
      - name: Package VSIX
        run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: release-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-vsix
          path: release-assets
      - name: Create a draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          RELEASE_TAG="v$RELEASE_VERSION"
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::This version tag already exists. Prepare a new version or manage that release manually."
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          Early preview of native VS Code reviews with automatic Claude Code feedback.

          Type checking and automated tests completed in this workflow. Live VS Code and authenticated Claude verification remains a separate release check; see docs/REVIEW.md.

          Install the attached VSIX through Extensions → … → Install from VSIX…. The demo uses a staged interface with simulated responses. Marketplace publication is a separate manual step.
          NOTES
          gh release create "$RELEASE_TAG" release-assets/*.vsix \
            --draft --prerelease --target "$GITHUB_SHA" \
            --title "Local Review $RELEASE_VERSION" --notes-file release-notes.md
